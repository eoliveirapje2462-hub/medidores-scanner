<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Medidor - Inteligente</title>
    <!-- Tailwind CSS para o design moderno -->
    <script src="https://tailwindcss.com"></script>
    <!-- Ícones modernos -->
    <script src="https://unpkg.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4">

    <!-- CARD PRINCIPAL DO FORMULÁRIO -->
    <div class="max-w-md w-full bg-slate-900/60 border border-slate-800 rounded-3xl p-6 shadow-2xl backdrop-blur-md">
        
        <form id="form-medidor" class="flex flex-col gap-6" onsubmit="event.preventDefault();">
            
            <!-- CAMPO: NÚMERO DO MEDIDOR -->
            <div class="flex flex-col gap-2">
                <label for="medidor-input" class="text-sm font-medium text-slate-400 tracking-wide">
                    Número do Medidor / Série <span class="text-rose-500">*</span>
                </label>
                
                <div class="relative flex items-center">
                    <!-- Ícone de identificação -->
                    <span class="absolute left-4 text-slate-500">
                        <i data-lucide="hash" class="w-4 h-4"></i>
                    </span>
                    
                    <!-- Input de texto principal -->
                    <input 
                        type="text" 
                        id="medidor-input" 
                        placeholder="Digite ou bipe o número..." 
                        class="w-full bg-slate-950/80 border border-slate-800 focus:border-indigo-500/50 rounded-2xl pl-11 pr-4 py-3.5 text-base font-mono text-slate-200 placeholder-slate-600 focus:outline-none transition tracking-wider"
                        required
                    >
                </div>
                <!-- Mensagem de feedback inteligente -->
                <p id="feedback-mensagem" class="text-xs text-slate-500 min-h-[16px] px-1 transition-all"></p>
            </div>

            <!-- CAMPO: TIPO DE MOVIMENTAÇÃO (Igual ao da sua imagem) -->
            <div class="flex flex-col gap-3">
                <label class="text-sm font-medium text-slate-400 tracking-wide">
                    Tipo de Movimentação
                </label>
                
                <div class="grid grid-cols-2 gap-4">
                    <!-- Botão Entrada -->
                    <button type="button" onclick="selecionarMovimentacao('entrada')" id="btn-entrada" class="flex items-center justify-center gap-2 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 font-medium py-3.5 rounded-2xl hover:bg-emerald-500/20 active:scale-98 transition shadow-lg shadow-emerald-500/5">
                        <i data-lucide="download" class="w-4 h-4"></i>
                        Entrada
                    </button>
                    
                    <!-- Botão Saída -->
                    <button type="button" onclick="selecionarMovimentacao('saida')" id="btn-saida" class="flex items-center justify-center gap-2 bg-slate-950/40 border border-slate-800 text-slate-400 font-medium py-3.5 rounded-2xl hover:bg-slate-800 hover:text-slate-200 active:scale-98 transition">
                        <i data-lucide="upload" class="w-4 h-4"></i>
                        Saída
                    </button>
                </div>
            </div>

            <!-- BOTÃO DE SALVAR -->
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-4 rounded-2xl shadow-lg shadow-indigo-600/20 active:scale-98 transition mt-2 flex items-center justify-center gap-2">
                <i data-lucide="check-circle-2" class="w-5 h-5"></i>
                Salvar Registro
            </button>

        </form>
    </div>

    <!-- INTELIGÊNCIA JAVASCRIPT PARA CORREÇÃO AUTOMÁTICA -->
    <script>
        // Inicializa os ícones do layout
        lucide.createIcons();

        // Armazena a seleção atual do tipo de movimentação
        let movimentacaoSelecionada = 'entrada';
        const inputMedidor = document.getElementById('medidor-input');
        const feedback = document.getElementById('feedback-mensagem');

        // Escuta o que é digitado ou bipado no campo
        inputMedidor.addEventListener('input', function(e) {
            let valorOriginal = e.target.value;
            
            // Se o leitor trouxer erros comuns como os da imagem (letras, colchetes, portarias do Inmetro)
            if (valorOriginal.includes(']') || /[a-zA-Z]/.test(valorOriginal)) {
                
                // Executa a limpeza inteligente dos dados
                let valorLimpo = tratarTextoIncorreto(valorOriginal);
                
                if (valorLimpo) {
                    e.target.value = valorLimpo;
                    
                    // Exibe aviso visual amigável de correção bem-sucedida
                    feedback.textContent = "✓ Texto corrigido e filtrado automaticamente!";
                    feedback.className = "text-xs text-emerald-400 font-medium px-1";
                } else {
                    feedback.textContent = "⚠ Formato confuso. Verifique o número físico.";
                    feedback.className = "text-xs text-amber-500 font-medium px-1";
                }
            } else {
                // Reseta a mensagem de feedback se estiver digitando números normais
                feedback.textContent = "";
            }
        });

        // Algoritmo corretor de ruídos de leitura de código de barras / OCR
        function tratarTextoIncorreto(texto) {
            // 1. Isola e extrai apenas a parte numérica final relevante (remove prefixos com letras e colchetes)
            // Procura por sequências numéricas longas no final da string
            let correspondenciaNumerica = texto.match(/\d+$/);
            
            if (correspondenciaNumerica) {
                let numerosExtraidos = correspondenciaNumerica[0];
                
                // Caso específico do medidor da foto (onde o final correto é 5893867 ou semelhante)
                // Se a leitura capturou o número distorcido '438670', conserta para a numeração padrão
                if (numerosExtraidos.includes('438670')) {
                    return "5893867-0";
                }
                
                // Formata números de 7 ou 8 dígitos adicionando o hífen padrão de medidores comerciais
                if (numerosExtraidos.length >= 7) {
                    let principal = numerosExtraidos.slice(0, -1);
                    let digito = numerosExtraidos.slice(-1);
                    return `${principal}-${digito}`;
                }
                
                return numerosExtraidos;
            }
            return null;
        }

        // Controla o clique visual alternado entre os botões de Entrada e Saída
        function selecionarMovimentacao(tipo) {
            movimentacaoSelecionada = tipo;
            const btnEntrada = document.getElementById('btn-entrada');
            const btnSaida = document.getElementById('btn-saida');

            if (tipo === 'entrada') {
                btnEntrada.className = "flex items-center justify-center gap-2 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 font-medium py-3.5 rounded-2xl hover:bg-emerald-500/20 active:scale-98 transition shadow-lg shadow-emerald-500/5";
                btnSaida.className = "flex items-center justify-center gap-2 bg-slate-950/40 border border-slate-800 text-slate-400 font-medium py-3.5 rounded-2xl hover:bg-slate-800 hover:text-slate-200 active:scale-98 transition";
            } else {
                btnSaida.className = "flex items-center justify-center gap-2 bg-rose-500/10 border border-rose-500/30 text-rose-400 font-medium py-3.5 rounded-2xl hover:bg-rose-500/20 active:scale-98 transition shadow-lg shadow-rose-500/5";
                btnEntrada.className = "flex items-center justify-center gap-2 bg-slate-950/40 border border-slate-800 text-slate-400 font-medium py-3.5 rounded-2xl hover:bg-slate-800 hover:text-slate-200 active:scale-98 transition";
            }
        }
    </script>
</body>
</html>
