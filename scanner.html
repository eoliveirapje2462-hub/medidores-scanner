<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Medidores</title>
  <!-- Biblioteca para leitura de Código de Barras / QR Code -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b0f19; color: #f1f5f9; padding: 12px; }

    /* Navegação por Abas */
    .tabs { display: flex; border-bottom: 2px solid #1e293b; margin-bottom: 16px; }
    .tab-btn { flex: 1; padding: 12px; background: none; border: none; color: #94a3b8; font-weight: 600; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .tab-btn.active { color: #6366f1; border-bottom: 2px solid #6366f1; }

    /* Containers e Cards */
    .card { background: #111827; border: 1px solid #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    
    /* Toggle e Leitor */
    .scanner-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .scanner-title { font-size: 0.95rem; font-weight: 600; color: #e2e8f0; }
    .switch-label { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #94a3b8; }
    .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #334155; transition: .3s; border-radius: 24px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: #6366f1; }
    input:checked + .slider:before { transform: translateX(20px); }

    #reader { width: 100%; border-radius: 8px; overflow: hidden; background: #000; margin-bottom: 12px; }

    /* Inputs e Form */
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; font-weight: 500; }
    input[type="text"] { width: 100%; padding: 12px; font-size: 1rem; background-color: #090d16; border: 1px solid #1e293b; border-radius: 8px; color: #fff; outline: none; }
    input[type="text"]:focus { border-color: #6366f1; }

    /* Botões Tipo de Movimentação (Entrada/Saída) */
    .tipo-group { display: flex; gap: 10px; }
    .btn-tipo { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #1e293b; background: #131c2e; color: #94a3b8; font-size: 0.95rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-tipo.active-entrada { background: #064e3b; border-color: #10b981; color: #34d399; }
    .btn-tipo.active-saida { background: #7f1d1d; border-color: #ef4444; color: #f87171; }

    /* Status e Botão Ação */
    .gps-status { font-size: 0.8rem; color: #10b981; margin-bottom: 14px; display: flex; align-items: center; gap: 6px; }
    .gps-dot { width: 6px; height: 6px; background-color: #10b981; border-radius: 50%; display: inline-block; }

    .btn-main { width: 100%; padding: 14px; font-size: 1rem; font-weight: 600; color: #fff; background-color: #4f46e5; border: none; border-radius: 8px; cursor: pointer; }
    .btn-confirmar { background-color: #059669; }
    .btn-confirmar:hover { background-color: #047857; }

    /* Banner Alerta de Erro / Sucesso */
    .alert-banner { display: none; padding: 14px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; text-align: center; margin-top: 16px; }
    .alert-erro { background-color: #dc2626; color: #fff; }
    .alert-sucesso { background-color: #059669; color: #fff; }
  </style>
</head>
<body>

  <!-- Abas superiores -->
  <div class="tabs">
    <button class="tab-btn active">📋 Registrar</button>
    <button class="tab-btn">📦 Histórico</button>
  </div>

  <!-- Bloco do Scanner -->
  <div class="card">
    <div class="scanner-header">
      <span class="scanner-title">Scanner de Código / QR</span>
      <label class="switch-label">
        Modo Lote
        <label class="switch">
          <input type="checkbox" id="modoLote">
          <span class="slider"></span>
        </label>
      </label>
    </div>

    <div id="reader" style="display: none;"></div>

    <button type="button" class="btn-main" id="btnCam" onclick="iniciarLeitor()">📷 Abrir Câmera</button>
  </div>

  <!-- Formuário -->
  <div class="card">
    <form id="formMedidor" onsubmit="salvarDados(event)">
      
      <div class="form-group">
        <label>Número do Medidor / Série</label>
        <input type="text" id="numeroMedidor" placeholder="Escaneie ou digite" required>
      </div>

      <div class="form-group">
        <label>Tipo de Movimentação</label>
        <div class="tipo-group">
          <button type="button" class="btn-tipo active-entrada" id="btnEntrada" onclick="selecionarTipo('Entrada')">📥 Entrada</button>
          <button type="button" class="btn-tipo" id="btnSaida" onclick="selecionarTipo('Saída')">📤 Saída</button>
        </div>
      </div>

      <div class="form-group" style="margin-top: 14px;">
        <label>Observação / Destino</label>
        <input type="text" id="observacao" placeholder="Ex: Estoque, Cliente X...">
      </div>

      <div class="gps-status">
        <span class="gps-dot"></span>
        <span id="txtGps">GPS capturado (obtendo...)</span>
      </div>

      <button type="submit" class="btn-main btn-confirmar" id="btnSalvar">Confirmar Movimentação</button>
    </form>
  </div>

  <!-- Banner de Mensagens (Erro / Sucesso) -->
  <div id="alertBanner" class="alert-banner"></div>

<script>
  const APPS_URL = "https://script.google.com/macros/s/SUA_URL_AQUI/exec";

  let html5QrCode = null;
  let tipoMovimentacao = "Entrada";
  let dadosGps = { lat: "", lng: "", precisao: "" };

  window.addEventListener('DOMContentLoaded', () => {
    obterGps();
  });

  function selecionarTipo(tipo) {
    tipoMovimentacao = tipo;
    const btnEntrada = document.getElementById('btnEntrada');
    const btnSaida = document.getElementById('btnSaida');

    if (tipo === 'Entrada') {
      btnEntrada.className = 'btn-tipo active-entrada';
      btnSaida.className = 'btn-tipo';
    } else {
      btnEntrada.className = 'btn-tipo';
      btnSaida.className = 'btn-tipo active-saida';
    }
  }

  function obterGps() {
    const txtGps = document.getElementById('txtGps');
    if ("geolocation" in navigator) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          dadosGps.lat = pos.coords.latitude;
          dadosGps.lng = pos.coords.longitude;
          dadosGps.precisao = pos.coords.accuracy;
          txtGps.innerText = `GPS capturado (±${Math.round(pos.coords.accuracy)}m)`;
        },
        () => { txtGps.innerText = "GPS indisponível"; },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }
  }

  // --- LEITOR CORRIGIDO ---
  async function iniciarLeitor() {
    const readerDiv = document.getElementById('reader');
    const btnCam = document.getElementById('btnCam');
    
    readerDiv.style.display = 'block';
    btnCam.innerText = "Fechar Câmera";
    btnCam.onclick = pararLeitor;

    if (!html5QrCode) {
      html5QrCode = new Html5Qrcode("reader");
    }

    const config = {
      fps: 15,
      qrbox: { width: 280, height: 130 },
      formatsToSupport: [
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.ITF,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.EAN_13
      ]
    };

    const onScanSuccess = (decodedText) => {
      document.getElementById('numeroMedidor').value = decodedText;
      
      const modoLote = document.getElementById('modoLote').checked;
      if (!modoLote) {
        pararLeitor();
      }
    };

    try {
      await html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess);
    } catch (err) {
      try {
        const devices = await Html5Qrcode.getCameras();
        if (devices && devices.length > 0) {
          const cameraTraseira = devices[devices.length - 1];
          await html5QrCode.start(cameraTraseira.id, config, onScanSuccess);
        } else {
          exibirAlerta("Nenhuma câmera encontrada.", "erro");
        }
      } catch (e) {
        exibirAlerta("Permissão de câmera negada.", "erro");
      }
    }
  }

  function pararLeitor() {
    const readerDiv = document.getElementById('reader');
    const btnCam = document.getElementById('btnCam');

    if (html5QrCode && html5QrCode.isScanning) {
      html5QrCode.stop().then(() => {
        readerDiv.style.display = 'none';
        btnCam.innerText = "📷 Abrir Câmera";
        btnCam.onclick = iniciarLeitor;
      });
    } else {
      readerDiv.style.display = 'none';
      btnCam.innerText = "📷 Abrir Câmera";
      btnCam.onclick = iniciarLeitor;
    }
  }

  function exibirAlerta(msg, tipo) {
    const banner = document.getElementById('alertBanner');
    banner.innerText = msg;
    banner.className = "alert-banner " + (tipo === "erro" ? "alert-erro" : "alert-sucesso");
    banner.style.display = "block";
    setTimeout(() => { banner.style.display = "none"; }, 4000);
  }

  // --- ENVIO DADOS ---
  function salvarDados(event) {
    event.preventDefault();
    const btn = document.getElementById('btnSalvar');
    btn.disabled = true;

    const numero = document.getElementById('numeroMedidor').value.trim();
    const observacao = document.getElementById('observacao').value.trim();

    const callbackName = 'jsonp_cb_' + Math.round(100000 * Math.random());

    window[callbackName] = function(data) {
      delete window[callbackName];
      document.body.removeChild(script);
      btn.disabled = false;

      if (data.status === 'sucesso') {
        exibirAlerta("Movimentação registrada!", "sucesso");
        document.getElementById('numeroMedidor').value = "";
      } else {
        exibirAlerta(data.mensagem || "Erro ao salvar", "erro");
      }
    };

    const url = `${APPS_URL}?callback=${callbackName}` +
      `&numero=${encodeURIComponent(numero)}` +
      `&tipo=${encodeURIComponent(tipoMovimentacao)}` +
      `&observacao=${encodeURIComponent(observacao)}` +
      `&lat=${encodeURIComponent(dadosGps.lat)}` +
      `&lng=${encodeURIComponent(dadosGps.lng)}` +
      `&precisao=${encodeURIComponent(dadosGps.precisao)}`;

    const script = document.createElement('script');
    script.src = url;
    script.onerror = function() {
      exibirAlerta("Falha ao comunicar com o servidor.", "erro");
      btn.disabled = false;
    };
    document.body.appendChild(script);
  }
</script>
</body>
</html>
